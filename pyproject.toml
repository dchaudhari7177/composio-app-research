[project]
name = "app-research-agent"
version = "0.1.0"
description = "Agent that researches SaaS apps for agent-toolkit buildability: auth, access gate, API surface, MCP, with evidence and verification loops."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv]
package = false
